name: Extract SVG Studio project
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-svgstudio.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair, verify and extract archive
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          zip -FF SVGStudio-Android-Pro.zip --out SVGStudio-Android-Pro-repaired.zip
          unzip -tq SVGStudio-Android-Pro-repaired.zip
          unzip -q -o SVGStudio-Android-Pro-repaired.zip
          rm SVGStudio-Android-Pro.zip SVGStudio-Android-Pro-repaired.zip
          rm .github/workflows/extract-svgstudio.yml
      - name: Commit extracted project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add extracted SVG Studio Android project"
          git push origin HEAD:main
